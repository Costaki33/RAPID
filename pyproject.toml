[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-benchmark"
version = "1.0.0"
description = "RAPID: benchmarking toolkit for real-time deep-learning seismic phase picking (faster-than-annotate inference paths, fair deployment benchmark, pick-quality scoring)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Constantinos Skevofilax", email = "cskevofilax@utexas.edu" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "obspy>=1.4",
    "seisbench>=0.10",
    "torch>=2.2",
    "psutil>=5.9",
    "nvidia-ml-py>=12.0",
]

[project.optional-dependencies]
# Ray-based orchestration benchmarks (Ripper / Model-Actor / Slipstream)
# also require the eqcctpro package -- see README "Orchestration benchmarks".
orchestration = ["ray>=2.40"]
# ONNX Runtime / TensorRT backends (see requirements-extra.txt for details)
onnx = ["onnx>=1.15", "onnxruntime-gpu>=1.17"]

[tool.setuptools.packages.find]
include = ["rapid*"]
