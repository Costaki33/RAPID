[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-seis"
version = "1.0.2"
description = "RAPID: real-time deep-learning seismic phase picking with Slipstream inference and Model-Actor / Ripper orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Constantinos Skevofilax", email = "cskevofilax@utexas.edu" },
]
keywords = [
    "seismology",
    "phase-picking",
    "seisbench",
    "deep-learning",
    "ray",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "obspy>=1.4",
    "seisbench>=0.10",
    "torch>=2.2",
    "psutil>=5.9",
    "nvidia-ml-py>=12.0",
]

[project.optional-dependencies]
# Optional: Model-Actor / Ripper (and related EvaluateSystem sweeps) need Ray.
orchestration = ["ray>=2.40"]

[project.urls]
Homepage = "https://github.com/Costaki33/RAPID"
Repository = "https://github.com/Costaki33/RAPID"
Issues = "https://github.com/Costaki33/RAPID/issues"

[tool.setuptools.packages.find]
include = ["rapid*"]
